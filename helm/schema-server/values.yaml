name: schema-server

image:
  registry: gsoci.azurecr.io
  name: giantswarm/schema-server
  tag: v0.0.1
  pullPolicy: IfNotPresent

hostnames:
  - schema.giantswarm.io
  - schema.operations.awsprod.gigantic.io

ingress:
  enabled: true

route:
  enabled: false
  parentRefs:
    redirect:  # @schema itemProperties: {group: {type: string}, kind: {type: string}, name: {type: string}, namespace: {type: string}, sectionName: {type: string}, port: {type: integer}}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: giantswarm-default
      namespace: envoy-gateway-system
      sectionName: http
    https:  # @schema itemProperties: {group: {type: string}, kind: {type: string}, name: {type: string}, namespace: {type: string}, sectionName: {type: string}, port: {type: integer}}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: giantswarm-default
      namespace: envoy-gateway-system
      sectionName: https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: giantswarm-default
      namespace: envoy-gateway-system
      sectionName: giantswarmio-https
  labels: {}  # @schema additionalProperties: {type: string}
  annotations: {}  # @schema additionalProperties: {type: string}

resources:
  requests:
    cpu: 5m  # @schema type: [string, number]
    memory: 5Mi  # @schema type: [string, number]
    ephemeralStorage: 100Mi  # @schema type: [string, number]
  limits:
    cpu: 50m  # @schema type: [string, number]
    memory: 50Mi  # @schema type: [string, number]
    ephemeralStorage: 500Mi  # @schema type: [string, number]

# -- Target CPU architecture for all pods of this chart. Empty imposes no
# constraint. `arm64` pins the pods to arm64 nodes, adding both the
# `kubernetes.io/arch` node selector and the toleration for the
# `kubernetes.io/arch=arm64:NoSchedule` taint that Giant Swarm arm64 node pools
# carry. Requires multi-arch images; an amd64-only image crash-loops with
# `exec format error` on an arm64 node.
architecture: ""  # @schema enum: ["", amd64, arm64]

# -- Node selector for all pods. Merged with `architecture`. Pinning to arm64
# here also adds the arm64 taint toleration. A value that contradicts
# `architecture` fails the render.
nodeSelector: {}  # @schema additionalProperties: {type: string}

# -- Tolerations for all pods. The arm64 toleration is added automatically
# when the pods are pinned to arm64.
tolerations: []  # @schema item: object; itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Toleration
